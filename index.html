<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#173F4B">
<title>판매이익 분석 · 빵을그리다</title>
<link rel="apple-touch-icon" href="logo_apple.png">
<link rel="icon" href="brand_logo.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* 빵을그리다(주) 판매이익 분석 — 이카운트 「판매현황」 엑셀을 올려 일·주·월·거래처·품목별 매출, 원가, 판매이익을 봅니다.
   이 파일은 공개 저장소에 올라가므로 판매 자료를 담지 않습니다. 자료는 연결한 구글 시트에 저장됩니다. */
:root{
  --bg:#EDF0F2; --paper:#FFFFFF; --ink:#16232B; --ink2:#4A5A65; --ink3:#8291A0;
  --line:#D6DDE3; --line2:#EAEEF1; --soft:#F5F7F9;
  --brand:#173F4B; --brand2:#1E5566; --accent:#0E7C6B; --accent-bg:#E3F3EF;
  --minus:#B23A3A; --minus-bg:#FBE9E9; --warn:#A86A12; --warn-bg:#FBF1DF; --good:#0E7C6B; --good-bg:#E3F3EF;
  --c-cost:#C3CDD5; --c-profit:#2A78D6; --c-loss:#E34948;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948; --s-etc:#AEB8C1;
  --radius:10px; --font:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:var(--font);font-size:14.5px;line-height:1.45;color:var(--ink);background:var(--bg);-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.muted{color:var(--ink3)} .small{font-size:12.5px} .neg{color:var(--minus)} .pos{color:var(--good)}
b,strong{font-weight:700}

/* frame */
header.hd{background:var(--brand);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:30}
header.hd h1{font-size:17px;font-weight:800;letter-spacing:-.2px;line-height:1.2}
header.hd .brand{display:flex;align-items:center;gap:10px}
header.hd .brand img{width:42px;height:42px;border-radius:10px;background:#fff;object-fit:cover;flex:0 0 auto}
header.hd .co{font-size:12px;font-weight:700;color:rgba(255,255,255,.78);letter-spacing:.2px}
@media (max-width:560px){header.hd .brand img{width:36px;height:36px}header.hd .dsum{display:none}}
header.hd .dsum{font-size:12.5px;color:rgba(255,255,255,.75)}
header.hd .grow{flex:1}
.srvpill{border-radius:20px;padding:5px 12px;font-size:12.5px;font-weight:700;background:rgba(255,255,255,.12);color:#fff;white-space:nowrap}
.srvpill.on{color:#9EE6CF}.srvpill.off,.srvpill.err{color:#FFB4B4}.srvpill.busy{color:#FFE29A}
header.hd .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff}
body.embed header.hd{display:none}
nav.tabs{display:flex;gap:4px;padding:8px 12px 0;overflow-x:auto;scrollbar-width:none;background:var(--bg)}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;padding:8px 13px;border-radius:9px 9px 0 0;font-weight:700;font-size:14px;color:var(--ink2);white-space:nowrap}
nav.tabs button.on{background:var(--paper);color:var(--brand);box-shadow:0 -1px 0 var(--line) inset}
@media (min-width:760px){body.embed nav.tabs{display:none}}
main{padding:12px 14px 40px;max-width:1360px;margin:0 auto}
body.embed main{padding-top:10px}

/* controls */
.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;min-height:34px;padding:0 12px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:#0b6a5b}
.btn.sm{min-height:28px;padding:0 9px;font-size:12.5px}
.btn.danger{color:var(--minus)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper);flex-wrap:wrap}
.seg button{min-height:32px;padding:0 11px;font-size:13px;font-weight:600;color:var(--ink2);border-right:1px solid var(--line2)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--brand);color:#fff}
input.f,select.f{border:1px solid var(--line);background:#fff;border-radius:8px;min-height:34px;padding:0 9px;font-size:13.5px;outline:none;max-width:100%}
input.f:focus,select.f:focus{border-color:var(--accent)}
input.f[type=date]{min-width:0}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row .grow{flex:1}

/* filter bar */
.fbar{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.fbar .rng{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fbar .rng .lbl{font-size:16px;font-weight:800;color:var(--brand);padding:0 4px;min-width:0}
.fbar .rng .lbl small{font-size:12px;color:var(--ink3);font-weight:600;margin-left:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--accent-bg);color:var(--accent);border-radius:20px;padding:3px 6px 3px 10px;font-size:12.5px;font-weight:700}
.chip button{width:20px;height:20px;border-radius:50%;color:var(--accent);font-weight:800}
.chip button:hover{background:rgba(14,124,107,.15)}
.fmore{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.fmore label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink2);font-weight:600}
.fmore select,.fmore input{width:100%}
.fmore label.row{flex-direction:row;align-items:center}.fmore label.row input{width:auto}

/* cards */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;min-width:0}
.card h2{font-size:15.5px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .grow{flex:1}
.card h2 small{font-weight:600;color:var(--ink3);font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2>.card{margin-bottom:0}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.gapb{margin-bottom:12px}

/* summary sentence */
.headline{background:var(--brand);color:#fff;border-radius:var(--radius);padding:14px 18px;margin-bottom:12px;font-size:15.5px;line-height:1.7}
.headline b{color:#fff;font-size:17px}
.headline .hs{display:block;font-size:13px;color:rgba(255,255,255,.78);margin-top:2px}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:12px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:560px){.kpis.k4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;min-width:0}
.kpi .kl{font-size:12.5px;color:var(--ink2);font-weight:700}
.kpi .kv{font-size:22px;font-weight:800;letter-spacing:-.4px;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .kv small{font-size:13px;font-weight:700;color:var(--ink2);margin-left:2px}
.kpi .ks{font-size:12px;color:var(--ink3)}
.kpi.main{border-color:var(--c-profit);box-shadow:inset 3px 0 0 var(--c-profit)}
.dl{font-weight:800;white-space:nowrap}
.dl.up{color:var(--good)} .dl.down{color:var(--minus)} .dl.flat{color:var(--ink3)}
.inv .dl.up{color:var(--minus)} .inv .dl.down{color:var(--good)}

/* tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line2);border-radius:8px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{background:var(--soft);color:var(--ink2);font-weight:700;font-size:12.5px;text-align:left;padding:8px 9px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;user-select:none}
table.t th[data-sort]{cursor:pointer}
table.t th[data-sort]:hover{color:var(--brand)}
table.t th .ar{font-size:10px;margin-left:3px;color:var(--accent)}
table.t td{padding:7px 9px;border-bottom:1px solid var(--line2);vertical-align:middle;white-space:nowrap}
table.t td.nm{max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.t .n{text-align:right;white-space:nowrap}
table.t tr[data-open]{cursor:pointer}
table.t tr[data-open]:hover td{background:#F2F8FB}
table.t tfoot td{font-weight:800;background:var(--soft);border-top:1px solid var(--line);border-bottom:0}
table.t td.why{white-space:normal;min-width:230px;font-size:12.5px;color:var(--ink2)}
.lnk{cursor:pointer}.lnk:hover{color:var(--brand);text-decoration:underline}
.fxsum{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:-2px 0 10px}
select.fx-exch,select.fx-svc,select.fx-promo,select.fx-done{background:var(--good-bg);color:var(--good)}select.fx-miss{background:var(--minus-bg);color:var(--minus)}select.fx-none{background:var(--warn-bg);color:var(--warn)}
select.mk{min-height:28px;font-size:12.5px;padding:0 4px}select.mk-ok,select.mk-done{background:var(--good-bg);color:var(--good)}select.mk-fix{background:var(--minus-bg);color:var(--minus)}
a.alert{text-decoration:none;color:inherit}
table.t td.rk{color:var(--ink3);width:34px;text-align:right}
.more{display:flex;justify-content:center;padding:8px}
.mg{display:inline-block;min-width:52px;text-align:right;font-weight:700}
.mg.bad{color:var(--minus)} .mg.low{color:var(--warn)}
.sbar{display:flex;align-items:center;gap:6px;min-width:110px}
.sbar i{display:block;height:8px;border-radius:0 4px 4px 0;background:var(--c-profit);flex:0 0 auto}
.sbar i.c{background:var(--brand2)}
.sbar span{font-size:12px;color:var(--ink2)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:10px;background:var(--line2);color:var(--ink2);white-space:nowrap}
.tag.red{background:var(--minus-bg);color:var(--minus)} .tag.amb{background:var(--warn-bg);color:var(--warn)} .tag.grn{background:var(--good-bg);color:var(--good)}

/* charts */
.chart{width:100%;min-height:60px;position:relative}
.chart svg{display:block;overflow:visible}
.chart text{font-family:var(--font);font-size:11px;fill:var(--ink3)}
.chart .gl{stroke:var(--line2);stroke-width:1}
.chart .ax{stroke:var(--line);stroke-width:1}
.chart .lb{fill:var(--ink2);font-weight:700;font-size:10.5px}
.chart .hit{fill:transparent;cursor:default}
.chart .hit:hover{fill:rgba(23,63,75,.06)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-bottom:6px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.legend i.ln{height:3px;border-radius:2px;vertical-align:3px;width:16px}
.comp{display:flex;height:22px;border-radius:6px;overflow:hidden;gap:2px;background:var(--paper);margin:4px 0 8px}
.comp div{height:100%;min-width:2px}
.hbar{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) auto;gap:4px 10px;align-items:center;font-size:13px}
@media (max-width:560px){.kpi .kv{font-size:17.5px}.kpi{padding:10px 11px}.hbar{grid-template-columns:minmax(0,1fr) 54px auto;font-size:12.5px}.card{padding:12px}main{padding:10px 8px 30px}.fbar .rng .lbl{font-size:15px}}
.hbar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.hbar .nm:hover{color:var(--brand);text-decoration:underline}
.hbar .bw{height:14px;position:relative}
.hbar .bw i{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;background:var(--c-profit)}
.hbar .bw i.neg{background:var(--c-loss)}
.hbar .vv{text-align:right;white-space:nowrap;font-weight:700}
.hbar .vv small{color:var(--ink3);font-weight:600;margin-left:4px}

/* alerts */
.alerts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
@media (max-width:900px){.alerts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.alert{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:11px 13px;text-align:left;display:block;width:100%}
.alert:hover{border-color:var(--brand2)}
.alert .al{font-size:12.5px;font-weight:700;color:var(--ink2);display:flex;gap:6px;align-items:center}
.alert .av{font-size:20px;font-weight:800;margin-top:2px}
.alert .as{font-size:12px;color:var(--ink3)}
.alert.red{border-left:4px solid var(--c-loss)} .alert.amb{border-left:4px solid var(--s4)} .alert.ok{border-left:4px solid var(--good)}

/* heat */
table.heat td.hv{text-align:right;white-space:nowrap;font-size:12.5px}

/* upload */
.drop{border:2px dashed var(--line);border-radius:var(--radius);padding:26px 16px;text-align:center;background:var(--soft);cursor:pointer}
.drop.on{border-color:var(--accent);background:var(--accent-bg)}
.drop b{font-size:16px;color:var(--brand)}
.steps{margin:6px 0 0 18px;line-height:1.8;font-size:13.5px;color:var(--ink2)}
.empty{text-align:center;padding:50px 16px;color:var(--ink2)}
.empty h2{font-size:19px;color:var(--brand);margin-bottom:8px}
.dl2{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px}
.dl2 dt{color:var(--ink3);font-weight:600}

/* tooltip / modal / toast */
#tip{position:fixed;z-index:90;pointer-events:none;background:#16232B;color:#fff;font-size:12.5px;line-height:1.55;padding:8px 10px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.2);max-width:280px;display:none}
#tip b{color:#fff} #tip .tr{display:flex;justify-content:space-between;gap:14px} #tip .tr span:first-child{color:#B9C7D1}
#tip i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.mbg{position:fixed;inset:0;background:rgba(10,20,26,.45);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:4vh 10px;overflow-y:auto}
.mbox{background:var(--paper);border-radius:12px;width:min(1000px,100%);padding:18px 18px 16px;box-shadow:0 20px 50px rgba(0,0,0,.25);position:relative}
.mbox.narrow{width:min(520px,100%)}
.mbox h2{font-size:18px;font-weight:800;margin-bottom:4px;padding-right:40px}
.mbox .x{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:8px;font-size:20px;color:var(--ink2)}
.mbox .x:hover{background:var(--soft)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#16232B;color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;z-index:95;display:none;max-width:90vw}

/* report (A4) */
.rp-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.rep{display:flex;flex-direction:column;align-items:center;gap:14px;overflow-x:auto;padding-bottom:6px}
.page{width:210mm;min-height:297mm;padding:10mm 11mm 8mm;background:#fff;box-shadow:0 2px 10px rgba(22,35,43,.14);border-radius:2px;color:#111;display:flex;flex-direction:column;flex:0 0 auto;font-size:12px}
.page .pg-body{flex:1}
.page .pg-top{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink2);border-bottom:2px solid var(--brand);padding-bottom:5px;margin-bottom:6px}
.page .pg-top img{width:22px;height:22px;border-radius:5px}
.page .pg-top b{color:var(--brand);font-size:12px}
.page .pg-foot{display:flex;justify-content:space-between;gap:10px;font-size:10px;color:var(--ink3);border-top:1px solid var(--line);padding-top:5px;margin-top:8px}
.rep .rp-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:3px solid var(--brand);padding-bottom:10px;margin-bottom:12px}
.rep .rp-left{display:flex;align-items:center;gap:12px}.rep .rp-logo{width:56px;height:56px;border-radius:10px;object-fit:cover}
.rep .rp-co{font-size:12px;color:var(--ink2);font-weight:700}
.rep h1{font-size:23px;font-weight:800;color:var(--brand);letter-spacing:-.4px;margin:2px 0}
.rep .rp-per{font-size:13px;color:var(--ink2);font-weight:600}
.rep table.sign{border-collapse:collapse;font-size:11px}
.rep table.sign th,.rep table.sign td{border:1px solid #9AA6AF;width:58px;text-align:center}
.rep table.sign th{background:var(--soft);padding:3px;font-weight:700}
.rep table.sign td{height:48px}
.rep .rk4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.rep .rk{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.rep .rk .kl{font-size:11px;color:var(--ink2);font-weight:700}
.rep .rk .kv{font-size:18px;font-weight:800;letter-spacing:-.4px;margin:1px 0;white-space:nowrap}
.rep .rk .ks{font-size:10.5px;color:var(--ink3)}
.rep .rk.main{border-color:var(--c-profit);background:#F3F8FE}
.rep .rp-sum{background:#F4F7F9;border-left:4px solid var(--brand);border-radius:6px;padding:9px 12px 8px;margin-bottom:4px}
.rep .rp-sum .st,.rep .memo .st{font-weight:800;color:var(--brand);font-size:12.5px;margin-bottom:3px}
.rep .rp-sum ol{margin:0 0 0 18px;line-height:1.75;font-size:12.5px}
.rep h3{font-size:13px;font-weight:800;color:var(--brand);margin:12px 0 5px;padding-left:7px;border-left:4px solid var(--accent);display:flex;align-items:baseline;gap:8px}
.rep h3 small{font-size:10.5px;color:var(--ink3);font-weight:600}
.rep .tw{border:0;border-radius:0;overflow:visible}
.rep table.t{font-size:11.5px}
.rep table.t th{font-size:10.5px;padding:4px 6px;position:static;cursor:default}
.rep table.t td{padding:3.5px 6px}
.rep table.t{width:100%}
.rep table.t td.nm{max-width:62mm;overflow:hidden;text-overflow:ellipsis}
.rep .two table.t td.nm{max-width:34mm}
.rep table.t td.why{min-width:0;font-size:11px}
.rep table.ctbl td:first-child{white-space:nowrap}
.rep .more{display:none}
.rep .rbar{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}.rep .rbar i{display:inline-block;height:7px;background:var(--c-profit);border-radius:0 3px 3px 0}
.rep .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rep .two>div{min-width:0}
.rep .note{font-size:11.5px;color:var(--ink2);padding:4px 2px}
.rep .ck6{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.rep .ck{border:1px solid var(--line);border-radius:7px;padding:6px 8px;border-top:4px solid var(--good)}
.rep .ck.red{border-top-color:var(--c-loss)}.rep .ck.amb{border-top-color:var(--s4)}.rep .ck.grn{border-top-color:var(--s1)}
.rep .ck .cl{font-size:10.5px;font-weight:700;color:var(--ink2)}.rep .ck .cv{font-size:18px;font-weight:800}.rep .ck .cs{font-size:9.5px;color:var(--ink3)}
.rep .memo{margin-top:12px;border:1px solid var(--line);border-radius:6px;padding:8px 12px}
.rep .memo .ln{border-bottom:1px solid var(--line2);height:24px}
.rep .chart text{font-size:10px}
@media (max-width:820px){.rep{align-items:flex-start}}
@page{size:A4;margin:10mm}
@media print{
  body{background:#fff}
  header.hd,nav.tabs,.fbar,.rp-tools,.noprint,#tip,#toast{display:none!important}
  main{padding:0;max-width:none}
  .rep{display:block;overflow:visible;padding:0;gap:0}
  .page{width:auto;height:277mm;min-height:0;padding:0;margin:0;box-shadow:none;border-radius:0;break-after:page;page-break-after:always;overflow:hidden}
  .page:last-child{break-after:auto;page-break-after:auto}

    · 비밀번호를 잊으면: Apps Script → 프로젝트 설정 → 스크립트 속성의 <b>KEY_HASH</b>를 지우고 새 비밀번호로 연결 (자료는 그대로)</div></div></div>`;
}
async function copyGs() {
  try { const r = await fetch('./sales_server.gs?v=' + Date.now(), { cache: 'no-store' }); if (!r.ok) throw 0; const t = await r.text(); await navigator.clipboard.writeText(t); toast('서버 코드를 복사했습니다 — Apps Script에 붙여넣으세요'); }
  catch (e) { toast('복사하지 못했습니다 — 저장소의 sales_server.gs 파일을 열어 복사하세요'); }
}

/* ── 그리기 ── */
const VIEWS = { dash: vDash, period: vPeriod, cust: vCust, item: vItem, group: vGroup, check: vCheck, audit: vAudit, report: vReport, rows: vRows, data: vData, conn: vConn };
function render() {
  setTimeout(renderSrv, 0);
  if (!VIEWS[UI.tab]) UI.tab = 'dash';
  for (const k in CH) delete CH[k];
  $('#tabs').innerHTML = TABS.map(([k, l]) => `<button data-act="tab" data-tab="${k}" class="${UI.tab === k ? 'on' : ''}">${l}</button>`).join('');
  $('#hdSum').textContent = R.length ? `자료 ${R[0].d} ~ ${R[R.length - 1].d} · ${nf.format(R.length)}줄` : '자료 없음';
  const needData = !['data', 'conn'].includes(UI.tab) && !R.length;
  $('#main').innerHTML = needData ? emptyBox() : VIEWS[UI.tab]();
  drawCharts($('#main'));
  if (UI.tab === 'data') bindDrop();
}
function bindDrop() {
  const d = $('#drop'); if (!d) return;
  ['dragenter', 'dragover'].forEach(ev => d.addEventListener(ev, e => { e.preventDefault(); d.classList.add('on'); }));
  ['dragleave', 'drop'].forEach(ev => d.addEventListener(ev, e => { e.preventDefault(); d.classList.remove('on'); }));
  d.addEventListener('drop', e => { const fs = [...(e.dataTransfer.files || [])]; if (fs.length) handleFiles(fs); });
}

/* ── 이벤트 (한 곳에서) ── */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-preset],[data-gran],[data-pgran],[data-gdim],[data-rtype],[data-sort],[data-more],[data-exp],[data-open],[data-unf],[data-fset]');
  if (!t) return;
  const D = t.dataset;
  if (D.preset) { setPreset(D.preset); saveUI(); render(); return; }
  if (D.gran) { UI.gran = D.gran; saveUI(); render(); return; }
  if (D.pgran) { UI.perGran = D.pgran; saveUI(); render(); return; }
  if (D.gdim) { UI.grpDim = D.gdim; saveUI(); render(); return; }
  if (D.rtype) { UI.rep.type = D.rtype; UI.rep.key = ''; saveUI(); render(); return; }
  if (D.sort) { const [id, k] = D.sort.split('|'), s = UI.sort[id]; UI.sort[id] = s && s.k === k ? { k, d: -s.d } : { k, d: -1 }; saveUI(); rerender(); return; }
  if (D.more) { UI.more[D.more] = 1; rerender(); return; }
  if (D.exp) { if (D.exp === 'pv') { xlsxSave([['교차분석', EXP.pv.aoa]], `교차분석_${UI.from}_${UI.to}.xlsx`); return; } const x = EXP[D.exp]; if (x) xlsxSave([[x.title, expAoa(x)]], `${x.title}_${UI.from}_${UI.to}.xlsx`); return; }
  if (D.unf) { delete UI.f[D.unf]; saveUI(); render(); return; }
  if (D.fset) { UI.f[D.fset] = D.v; UI.fOpen = true; saveUI(); closeModal(); render(); toast(`${DIMLBL[D.fset]} 「${D.v}」만 봅니다 — 조건의 ×로 풀 수 있습니다`); return; }
  if (D.open) {
    if (D.open === 'cust' || D.open === 'item') { openDetail(D.open, D.key); return; }
    if (D.open === 'range') { const [a, b] = D.key.split('|'); setRange(a, b); if (UI.tab === 'period') UI.perGran = UI.perGran === 'month' ? 'week' : 'day'; saveUI(); render(); return; }
    if (D.open === 'fset') { const i = D.key.indexOf('|'); UI.f[D.key.slice(0, i)] = D.key.slice(i + 1); UI.fOpen = true; saveUI(); render(); return; }
  }
  switch (D.act) {
    case 'tab': closeModal(); goTab(D.tab); break;
    case 'close': closeModal(); break;
    case 'step': stepRange(+D.d); saveUI(); render(); break;
    case 'range': setRange(D.a, D.b); saveUI(); render(); break;
    case 'fopen': UI.fOpen = !UI.fOpen; saveUI(); render(); break;
    case 'fclear': UI.f = {}; saveUI(); render(); break;
    case 'pick': $('#fileIn').click(); break;
    case 'backup': backup(); break;
    case 'restore': $('#bakIn').click(); break;
    case 'sync': if (srvOn()) syncLoad(); else goTab('conn'); break;
    case 'connect': srvConnect(); break;
    case 'logout': srvLogout(); break;
    case 'copygs': copyGs(); break;
    case 'wipe': if (confirm('이 기기에 저장된 판매 자료·품목등록·거래처 분류를 모두 지울까요? (먼저 백업을 내보내 두세요)')) { DB.rows = []; DB.items = {}; DB.itemsAt = ''; DB.uploads = []; DB.cust = {}; DB.audit = {}; dbSave().then(afterData); } break;
    case 'print': window.print(); break;
    case 'repxls': repExcel(); break;
    case 'audxls': { const sh = AUD.filter(x => EXP['au_' + x[0]] && EXP['au_' + x[0]].rows.length).map(x => [x[1].slice(0, 28), expAoa(EXP['au_' + x[0]])]); if (EXP.au_dupc) sh.push(['거래처 중복', expAoa(EXP.au_dupc)]); if (!sh.length) { toast('저장할 점검 결과가 없습니다'); break; } xlsxSave(sh, `전표점검_${UI.from}_${UI.to}.xlsx`); break; }
  }
});
function rerender() { const y = window.scrollY, m = $('#mbg'); if (m) { const sc = m.scrollTop, tit = $('.mbox h2', m).textContent, type = $('[data-fset]', m) ? $('[data-fset]', m).dataset.fset : ''; openDetail(type === 'c' ? 'cust' : 'item', tit); $('#mbg').scrollTop = sc; return; } render(); window.scrollTo(0, y); }
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'fileIn' || t.id === 'bakIn') { const fs = [...t.files]; t.value = ''; if (!fs.length) return; if (t.id === 'fileIn') handleFiles(fs); else restore(fs[0]); return; }
  if (t.id === 'fFrom' || t.id === 'fTo') { setRange($('#fFrom').value, $('#fTo').value); saveUI(); render(); return; }
  if (t.id === 'fUnit') { UI.unit = t.value; saveUI(); render(); return; }
  if (t.dataset.fk) { if (t.value) UI.f[t.dataset.fk] = t.value; else delete UI.f[t.dataset.fk]; saveUI(); render(); return; }
  if (['pvR', 'pvC', 'pvV', 'pvT'].includes(t.id)) { UI.pv = { r: $('#pvR').value, c: $('#pvC').value, v: $('#pvV').value, top: +$('#pvT').value }; saveUI(); render(); return; }
  if (['ckMg', 'ckMin', 'ckSp', 'ckGap'].includes(t.id)) { UI.chk = { mg: +$('#ckMg').value || 0, minAmt: +$('#ckMin').value || 0, spread: +$('#ckSp').value || 0, gap: Math.max(1, +$('#ckGap').value || 3) }; saveUI(); render(); return; }
  if (t.id === 'repKey') { UI.rep.key = t.value; saveUI(); render(); return; }
  if (t.dataset.mark != null) {
    const k = t.dataset.mark, fx = k.startsWith('fx|'); DB.audit = DB.audit || {};
    if (fx) DB.audit[k] = t.value; else if (t.value) DB.audit[k] = t.value; else delete DB.audit[k];   /* 교환·무상 유형은 「미분류」로 되돌린 것도 기억 (자동 판단보다 우선) */
    if (srvOn()) api('mark', { key: k, status: fx && !t.value ? '-' : t.value }).catch(e => toast('구글 시트에 저장하지 못했습니다: ' + e.message));
    dbSave('audit');
    if (fx) { splitFree(); rerender(); toast(`「${FXL[t.value] || '미분류'}」(으)로 정했습니다`); return; }
    t.className = 'f mk mk-' + (t.value || 'none'); if (UI.audHide && (t.value === 'ok' || t.value === 'done')) rerender(); return; }
  if (t.id === 'audHide' || t.id === 'audRep') { UI[t.id] = t.checked; saveUI(); rerender(); return; }
  if (t.id === 'repUnit') { UI.rep.unit = t.value; saveUI(); render(); return; }
  if (t.id === 'repAll') { UI.rep.all = t.checked; saveUI(); render(); return; }
  if (t.dataset.cg) { const c = t.dataset.c, o = DB.cust[c] = DB.cust[c] || {}; o[t.dataset.cg] = t.type === 'checkbox' ? t.checked : t.value.trim(); dbSave('cust'); enrich(); clearTimeout(_cuT); _cuT = setTimeout(() => { if (srvOn()) api('putCust', { rows: custRows() }).then(() => toast('거래처 분류를 구글 시트에 저장했습니다')).catch(e => toast('구글 시트에 저장하지 못했습니다: ' + e.message)); }, 800); return; }
});
let _qT = null, _cuT = null;
document.addEventListener('input', e => {
  const t = e.target, id = t.id; if (!['fQ', 'custQ', 'rowsQ', 'cfgQ'].includes(id)) return;
  clearTimeout(_qT); _qT = setTimeout(() => {
    if (id === 'fQ') { if (t.value.trim()) UI.f.q = t.value.trim(); else delete UI.f.q; } else UI[id] = t.value;
    saveUI(); const pos = t.selectionStart; render(); const n = $('#' + id); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (er) {} }
  }, 350);
});
/* 말풍선 */
const tip = $('#tip');
document.addEventListener('mouseover', e => { const t = e.target.closest('[data-tip]'); if (!t) { tip.style.display = 'none'; return; } tip.innerHTML = t.getAttribute('data-tip'); tip.style.display = 'block'; });
document.addEventListener('mousemove', e => { if (tip.style.display !== 'block') return; const w = tip.offsetWidth, h = tip.offsetHeight; let x = e.clientX + 14, y = e.clientY + 14; if (x + w > innerWidth - 8) x = e.clientX - w - 14; if (y + h > innerHeight - 8) y = e.clientY - h - 14; tip.style.left = Math.max(4, x) + 'px'; tip.style.top = Math.max(4, y) + 'px'; });
document.addEventListener('touchstart', e => { const t = e.target.closest('[data-tip]'); if (!t) { tip.style.display = 'none'; return; } const p = e.touches[0]; tip.innerHTML = t.getAttribute('data-tip'); tip.style.display = 'block'; tip.style.left = Math.max(4, Math.min(innerWidth - tip.offsetWidth - 4, p.clientX - tip.offsetWidth / 2)) + 'px'; tip.style.top = Math.max(4, p.clientY - tip.offsetHeight - 16) + 'px'; }, { passive: true });
let _rz = null; window.addEventListener('resize', () => { clearTimeout(_rz); _rz = setTimeout(() => drawCharts(), 150); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

(async function boot() {
  await dbLoad(); enrich();
  if (UI.preset !== 'custom' || !UI.from) setPreset(UI.preset === 'custom' ? 'month' : UI.preset);
  if (!srvOn()) UI.tab = 'conn'; else if (!R.length && UI.tab !== 'data' && UI.tab !== 'conn') UI.tab = 'data';
  render(); renderSrv();
  if (srvOn()) syncLoad(true);
})();
</script>
